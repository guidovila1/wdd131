<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description"
        content="This is a form page for the WDD 131 class assignment using HTML, CSS, and JavaScript. The form allows users to submit a product review with various input types.">
    <meta name="author" content="Guido Alejandro Vila Montano">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Poppins:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>



</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">
            <div class="form-group">
                <label for="product">Product Name </label>
                <select name="product" id="product" required>
                    <option value="" disabled selected>Select a Product ... </option>

                </select>


            </div>

            <div class="form-group">

                <p>Overall Rating</p>
                <div class="rating-flex">
                    <div class="radio-vertical">
                        <label for="rating1">★</label>
                        <input type="radio" id="rating1" name="overallRating" value="1" required>

                    </div>

                    <div class="rafting-flex">
                        <label for="rating2">★★</label>
                        <input type="radio" id="rating2" name="overallRating" value="2" required>

                    </div>
                    <div class="rafting-flex">
                        <label for="rating3">★★★</label>
                        <input type="radio" id="rating3" name="overallRating" value="3" required>

                    </div>
                    <div class="rafting-flex">
                        <label for="rating4">★★★★</label>
                        <input type="radio" id="rating4" name="overallRating" value="4" required>
                    </div>
                    <div class="rafting-flex">
                        <label for="rating5">★★★★★</label>
                        <input type="radio" id="rating5" name="overallRating" value="5" required>

                    </div>
                </div>

                <div class="form-group">
                    <label for="installationdate">
                        Date of installation </label>
                    <input type="date" id="installationdate" name="installationdate" required>



                </div>

                <div class="form-group">
                    <p>
                        Which features did you find useful in the product?(Check all that apply)
                    </p>

                    <input type="checkbox" id="featuredurability" name="features" value="durability">
                    <label for="featuredurability">Durability</label>

                    <input type="checkbox" id="featureeasy" name="features" value="easy">
                    <label for="featureeasy">Easy to use</label>

                    <input type="checkbox" id="featureperformance" name="features" value="performance">
                    <label for="featureperformance">Performance</label>

                    <input type="checkbox" id="featuredesign" name="features" value="design">
                    <label for="featuredesign">Design</label>
                </div>

                <div class="form-group">
                    <label for="review">Written Review (optional)</label>
                    <textarea name="review" id="review" rows="4"></textarea>



                </div>
                <div class="form-group">
                    <label for="username">Your Name (optional)</label>
                    <input type="text" id="username" name="username">
                </div>


                <div class="form-group">
                    <button type="submit">Submit Review</button>

                </div>
        </form>


    </main>

    <footer>

        <p>
            &copy; <span id="currentyear"></span> | Guido Alejandro Vila Montano | Bolivia
        </p>
        <p id="lastModified"></p>


    </footer>

</body>

</html>
