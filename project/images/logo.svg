<svg width="320" height="120" viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg">

  <!-- Fondo -->
  <rect width="100%" height="100%" fill="white"></rect>

  <!-- Turbina eólica -->
  <g transform="translate(50,60)">
    <!-- Torre -->
    <rect x="-2" y="0" width="4" height="30" fill="#555"></rect>
    
    <!-- Centro -->
    <circle cx="0" cy="0" r="4" fill="#555"></circle>
    
    <!-- Aspas -->
    <path d="M0 0 L0 -20 L4 -5 Z" fill="#4CAF50"></path>
    <path d="M0 0 L17 10 L4 5 Z" fill="#4CAF50"></path>
    <path d="M0 0 L-17 10 L-4 5 Z" fill="#4CAF50"></path>
  </g>

  <!-- Panel solar -->
  <g transform="translate(90,65)">
    <!-- Base -->
    <rect x="0" y="10" width="30" height="4" fill="#555"></rect>
    
    <!-- Panel -->
    <rect x="0" y="0" width="30" height="15" fill="#2196F3"></rect>
    
    <!-- Líneas del panel -->
    <line x1="10" y1="0" x2="10" y2="15" stroke="white" stroke-width="1"></line>
    <line x1="20" y1="0" x2="20" y2="15" stroke="white" stroke-width="1"></line>
    <line x1="0" y1="7.5" x2="30" y2="7.5" stroke="white" stroke-width="1"></line>
  </g>

  <!-- Sol -->
  <circle cx="75" cy="25" r="10" fill="#FFD54F"></circle>

  <!-- Texto -->
  <text x="140" y="55" font-family="Arial, sans-serif" font-size="20" fill="#222">
    RenewWorld
  </text>

  <text x="140" y="80" font-family="Arial, sans-serif" font-size="13" fill="#666">
    Solutions
  </text>

</svg>